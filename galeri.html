<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeri Foto & Video – PORTAL PPDS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="galeri">
  <header id="site-header" class="site-header"></header>

  <main class="container section">
    <div id="list-section">
      <div class="section-title">
        <h2>Galeri Foto & Video</h2>
        <a class="btn btn-small is-hidden" data-staff-only href="kelola-galeri.html">Kelola Galeri</a>
      </div>

      <!-- Banner Pintasan Album Nostalgia -->
      <div style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: #fff; padding: 1rem 1.25rem; border-radius: 10px; border-left: 5px solid var(--gold); margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
        <div>
          <strong style="color: #ffd700; font-size: 1rem; display: flex; align-items: center; gap: 0.35rem;">
            <span>📜</span> Khusus Foto Kenangan Masa Dinas Tempo Dulu
          </strong>
          <div style="font-size: 0.85rem; color: #cbd5e1; margin-top: 0.2rem;">
            Ingin melihat foto jadul peresmian kilang, suasana kerja era 70-an – 90-an, atau menyumbang foto lama?
          </div>
        </div>
        <a href="nostalgia.html" class="btn btn-small" style="background: var(--gold); color: var(--navy); font-weight: 700; text-decoration: none; white-space: nowrap;">
          Buka Album Nostalgia &rarr;
        </a>
      </div>
      <div id="album-list" class="grid grid-3"><div class="loading">Memuat galeri...</div></div>
    </div>

    <div id="detail" class="is-hidden"></div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/galeri-page.js"></script>
</body>
</html>
