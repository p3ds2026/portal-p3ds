<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelola Agenda – PORTAL P3DS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="agenda">
  <header id="site-header" class="site-header"></header>

  <main class="container section">
    <div id="denied" class="alert alert-error is-hidden">
      Halaman ini khusus Pengurus dan Administrator. <a href="agenda.html">Kembali ke Agenda</a>
    </div>

    <div id="panel" class="is-hidden">
      <div class="section-title"><h2>Kelola Agenda Kegiatan</h2><a href="agenda.html">Lihat halaman publik</a></div>
      <div id="msg" class="is-hidden" role="alert"></div>

      <div class="form-card">
        <h1 id="form-title">Tambah Agenda Baru</h1>
        <form id="form-agenda" novalidate>
          <input type="hidden" name="id">
          <div class="form-group">
            <label for="title">Nama Kegiatan</label>
            <input id="title" name="title" type="text" maxlength="200" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="start_at">Waktu Mulai</label>
              <input id="start_at" name="start_at" type="datetime-local" required>
            </div>
            <div class="form-group">
              <label for="end_at">Waktu Selesai (opsional)</label>
              <input id="end_at" name="end_at" type="datetime-local">
            </div>
          </div>
          <div class="form-group">
            <label for="location">Tempat</label>
            <input id="location" name="location" type="text" maxlength="200">
          </div>
          <div class="form-group">
            <label for="description">Keterangan</label>
            <textarea id="description" name="description" rows="5"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="visibility">Siapa yang boleh melihat</label>
              <select id="visibility" name="visibility">
                <option value="public">Semua pengunjung</option>
                <option value="member">Khusus anggota</option>
              </select>
            </div>
            <div class="form-group">
              <label for="status">Status</label>
              <select id="status" name="status">
                <option value="draft">Draft (belum tampil)</option>
                <option value="published">Terbitkan sekarang</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="cover_url">Alamat gambar (opsional)</label>
            <input id="cover_url" name="cover_url" type="url" placeholder="https://...">
          </div>
          <button id="btn-submit" class="btn" type="submit">Simpan</button>
          <button id="btn-cancel" class="btn btn-outline-dark is-hidden" type="button">Batal Ubah</button>
        </form>
      </div>

      <h2 style="margin-top:2rem">Daftar Agenda</h2>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Kegiatan</th><th>Waktu</th><th>Tempat</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/events.js"></script>
  <script src="js/events-admin.js"></script>
</body>
</html>
