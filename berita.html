<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berita & Pengumuman – PORTAL PPDS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="berita">
  <header id="site-header" class="site-header"></header>

  <main class="container section">
    <div id="list-section">
      <div class="section-title">
        <h2>Berita & Pengumuman</h2>
        <a id="link-kelola" class="btn btn-small is-hidden" data-staff-only href="kelola-berita.html">Kelola Berita</a>
      </div>
      <div class="filter-bar" style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center;">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <label for="filter-category" style="font-weight: 600;">Kategori:</label>
          <select id="filter-category">
            <option value="">Semua Kategori</option>
            <option value="berita">Berita Kegiatan</option>
            <option value="pengumuman">Pengumuman Resmi</option>
            <option value="duka">🖤 Kabar Duka Cita</option>
            <option value="kesehatan">🏥 Layanan & Pensiun</option>
          </select>
        </div>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <label for="filter-wilayah" style="font-weight: 600;">Wilayah:</label>
          <select id="filter-wilayah">
            <option value="">Semua Wilayah</option>
          </select>
        </div>
      </div>
      <div id="news-list" class="grid grid-3"><div class="loading">Memuat berita...</div></div>
    </div>

    <div id="detail" class="is-hidden"></div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/korwil.js"></script>
  <script src="js/news.js"></script>
  <script src="js/audio-reader.js"></script>
  <script src="js/berita-page.js"></script>
</body>
</html>
