<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berita & Pengumuman – PORTAL P3DS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="berita">
  <header id="site-header" class="site-header"></header>

  <main class="container section">
    <div id="list-section">
      <div class="section-title">
        <h2>Berita & Pengumuman</h2>
        <a id="link-kelola" class="btn btn-small is-hidden" data-staff-only href="kelola-berita.html">Kelola Berita</a>
      </div>
      <div class="filter-bar">
        <label for="filter-category">Tampilkan:</label>
        <select id="filter-category">
          <option value="">Semua</option>
          <option value="berita">Berita</option>
          <option value="pengumuman">Pengumuman</option>
        </select>
      </div>
      <div id="news-list" class="grid grid-3"><div class="loading">Memuat berita...</div></div>
    </div>

    <div id="detail" class="is-hidden"></div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/news.js"></script>
  <script src="js/berita-page.js"></script>
</body>
</html>
