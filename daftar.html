<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Anggota – PORTAL PPDS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="daftar">
  <header id="site-header" class="site-header"></header>

  <main class="container">
    <div class="page-narrow">
      <div class="form-card">
        <h1>Daftar Sebagai Anggota</h1>
        <p>Isi data berikut. Akun baru akan diperiksa dan disetujui oleh Administrator PPDS.</p>
        <div id="msg" class="is-hidden" role="alert"></div>
        <form id="form-daftar" novalidate>
          <div class="form-group">
            <label for="full_name">Nama Lengkap</label>
            <input id="full_name" name="full_name" type="text" autocomplete="name" maxlength="100" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required>
            <span class="hint">Minimal 8 karakter, campuran huruf dan angka.</span>
          </div>
          <div class="form-group">
            <label for="password2">Ulangi Password</label>
            <input id="password2" name="password2" type="password" autocomplete="new-password" required>
          </div>
          <button id="btn-submit" class="btn btn-block" type="submit">Daftar</button>
        </form>
        <p class="form-footer">Sudah punya akun? <a href="login.html">Masuk</a></p>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-pages.js"></script>
</body>
</html>
